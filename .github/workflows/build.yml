name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CheckMessage-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 폰에서 바로 받을 수 있게 Releases에 APK 게시
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CheckMessage.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CheckMessage 빌드 ${{ github.run_number }}
          files: CheckMessage.apk
          make_latest: true
